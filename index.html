<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Telegram Unity Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      var unityInstance;
      window.addEventListener('load', () => {
        const tg = window.Telegram.WebApp;
        tg.ready();
        const playerData = tg.initDataUnsafe.user;

        if (unityInstance) {
          unityInstance.SendMessage('WebAppBridge', 'OnTelegramUserData', JSON.stringify(playerData));
        }
      });
    </script>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas"></canvas>
    </div>
    <script src="%UNITY_WEBGL_LOADER_URL%"></script>
    <script>
      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "%UNITY_WEBGL_DATA_URL%",
        frameworkUrl: "%UNITY_WEBGL_FRAMEWORK_URL%",
        codeUrl: "%UNITY_WEBGL_CODE_URL%",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "%COMPANY_NAME%",
        productName: "%PRODUCT_NAME%",
        productVersion: "%PRODUCT_VERSION%",
      }).then((instance) => {
        unityInstance = instance;
      });
    </script>
  </body>
</html>
